name: Refresh GitHub stats

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger a Vercel rebuild
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK is not set; skipping."
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$DEPLOY_HOOK"
